# Sugo: 집 Windows PC(Docker Desktop)에서 LAN 전용으로 실행.
# 사용법은 docs/deploy-windows.md, 보안 설계는 docs/security.md 참고.
# 비밀값은 .env (deploy/setup.ps1 이 자동 생성, 커밋 금지).
name: sugo

x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-postgres-image: &postgres-image postgres:16.16-alpine3.24@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d

services:
  web:
    <<: *hardening
    image: ${SUGO_IMAGE:-ghcr.io/jeongyounghoon-star/sugo:latest}
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://sugo:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 를 .env 에 설정하세요 (deploy/setup.ps1)}@db:5432/sugo
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
    # 웹만 LAN에 노출. 외부 공개는 하지 않는다 (공유기 포트포워딩/UPnP 금지, 방화벽은 로컬 서브넷만).
    ports:
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-3000}:3000"
    networks: [frontend, backend]
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/.next/cache:size=128m,uid=1000,gid=1000,mode=0700
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  db:
    <<: *hardening
    image: *postgres-image
    user: "70:70" # 이미지의 postgres 사용자 (root로 실행하지 않음)
    environment:
      POSTGRES_USER: sugo
      POSTGRES_DB: sugo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 를 .env 에 설정하세요}
    # 호스트 포트를 열지 않는다: 내부 네트워크(backend)에서만 접근
    volumes:
      - pgdata:/var/lib/postgresql/data
    tmpfs:
      - /var/run/postgresql:size=8m,uid=70,gid=70,mode=0775
      - /tmp:size=64m,mode=1777
    shm_size: 128m
    networks: [backend]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 200
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "sugo", "-d", "sugo"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backup:
    <<: *hardening
    image: *postgres-image
    user: "70:70"
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_healthy # web 이 마이그레이션을 끝낸 뒤 첫 백업
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      PGHOST: db
      PGUSER: sugo
      PGDATABASE: sugo
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 를 .env 에 설정하세요}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - ./deploy/backup.sh:/backup.sh:ro
      - ./deploy/restore-test.sh:/restore-test.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups
    tmpfs:
      - /tmp:size=16m,mode=1777
    networks: [backend]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64

networks:
  frontend: {}
  backend:
    internal: true # 인터넷/호스트로 나가는 길 없음

volumes:
  pgdata: {}
