version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # node 메이저 버전은 직접 올린다 (런타임 호환성 확인 필요)
      - dependency-name: node
        update-types: [version-update:semver-major]
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    ignore:
      # postgres 메이저 업그레이드(16→17)는 기존 데이터 폴더와 호환되지 않아 DB 가 뜨지 않는다.
      # 백업 → pg_dump/restore 로 직접 옮겨야 하므로 자동 PR 을 만들지 않는다.
      - dependency-name: postgres
        update-types: [version-update:semver-major]
