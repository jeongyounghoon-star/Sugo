name: Docker image

# main 에 머지되어 CI 가 통과한 커밋만 이미지로 만들어 GHCR 에 올리고, Sigstore(keyless)로 서명한다.
# (PR/다른 브랜치에서는 절대 푸시하지 않음. workflow_run 은 기본 브랜치의 이 파일로 실행된다.)
# 집 PC 의 deploy/update.ps1 은 "이 워크플로가 main 에서 서명한 digest" 만 실행한다.
# 순서: digest 로 푸시 → 서명 → PC 와 똑같은 코드(deploy/lib.ps1)로 검증 → 그 다음에만 :latest 이동
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: docker-publish
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # Sigstore keyless 서명용 OIDC 토큰 (이 job 에서만)
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/sugo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # latest 는 서명 검증 뒤에 따로 붙인다
          tags: |
            type=sha,format=long,prefix=sha-
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - name: Sign (keyless, digest)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: Verify exactly like the home PC (deploy/lib.ps1)
        shell: pwsh
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          . ./deploy/lib.ps1
          $r = Test-SugoImageSignature -Ref "$($env:IMAGE)@$($env:DIGEST)"
          Write-Host $r.Reason
          if (-not $r.Ok) { exit 1 }
      - name: Move latest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: docker buildx imagetools create --tag "${IMAGE}:latest" "${IMAGE}@${DIGEST}"
      - name: Check latest the way the home PC sees it (resolve latest → verify signature)
        shell: pwsh
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          . ./deploy/lib.ps1
          $ref = Resolve-LatestDigest -Repo $env:IMAGE
          if ($ref -ne "$($env:IMAGE)@$($env:DIGEST)") { Write-Error "latest resolves to $ref, expected $($env:DIGEST)"; exit 1 }
          $r = Test-SugoImageSignature -Ref $ref
          Write-Host "$ref -> $($r.Reason)"
          if (-not $r.Ok) { exit 1 }
